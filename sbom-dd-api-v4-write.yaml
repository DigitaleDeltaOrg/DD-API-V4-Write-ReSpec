# Afhankelijkheden (Externe Componenten)
dependencies:
  # Standaarden
  - ref: "OpenAPI 3.1"
    dependsOn:
      - ref: "JSON"
      - ref: "HTTP/1.1"
    properties:
      - name: "standard"
        value: "OpenAPI Specification 3.1.0"
      - name: "url"
        value: "https://spec.openapis.org/oas/v3.1.0"
      - name: "role"
        value: "API specification format"

  - ref: "JSON"
    properties:
      - name: "standard"
        value: "RFC 8259"
      - name: "url"
        value: "https://datatracker.ietf.org/doc/html/rfc8259"
      - name: "role"
        value: "Data format"
      - name: "mimeType"
        value: "application/json"

  - ref: "GeoJSON"
    dependsOn:
      - ref: "JSON"
    properties:
      - name: "standard"
        value: "RFC 7946"
      - name: "url"
        value: "https://datatracker.ietf.org/doc/html/rfc7946"
      - name: "role"
        value: "Geometry format"
      - name: "mimeType"
        value: "application/geo+json"

  - ref: "ISO 8601"
    properties:
      - name: "standard"
        value: "ISO 8601:2004"
      - name: "url"
        value: "https://www.iso.org/standard/40874.html"
      - name: "role"
        value: "Date/time format"

  - ref: "HTTP/1.1"
    properties:
      - name: "standard"
        value: "RFC 9112"
      - name: "url"
        value: "https://datatracker.ietf.org/doc/html/rfc9112"
      - name: "role"
        value: "Transport protocol"

  - ref: "HTTPS"
    dependsOn:
      - ref: "HTTP/1.1"
    properties:
      - name: "standard"
        value: "RFC 2818"
      - name: "url"
        value: "https://datatracker.ietf.org/doc/html/rfc2818"
      - name: "role"
        value: "Secure transport protocol"

  # DD API V4 Core
  - ref: "DD API V4 Core"
    properties:
      - name: "version"
        value: "4.0"
      - name: "url"
        value: "https://digitaledeltaorg.github.io/DD-API-V4-ReSpec/"
      - name: "role"
        value: "Base API specification"
      - name: "relationship"
        value: "extends"

  # Vocabularia
  - ref: "Aquo Vocabulary"
    properties:
      - name: "namespace"
        value: "https://definities.pdok.nl/def/imkl/1.0/id/waarnemingssoort/"
      - name: "url"
        value: "https://aquo.nl"
      - name: "role"
        value: "Observation parameter vocabulary"
      - name: "maintainer"
        value: "Informatiehuis Water"

  # Security
  - ref: "OAuth2"
    properties:
      - name: "standard"
        value: "RFC 6749"
      - name: "url"
        value: "https://datatracker.ietf.org/doc/html/rfc6749"
      - name: "role"
        value: "Authentication framework"

  - ref: "Bearer Token"
    dependsOn:
      - ref: "OAuth2"
    properties:
      - name: "standard"
        value: "RFC 6750"
      - name: "url"
        value: "https://datatracker.ietf.org/doc/html/rfc6750"
      - name: "role"
        value: "Token authentication"

  - ref: "mTLS"
    properties:
      - name: "standard"
        value: "RFC 5246 (TLS 1.2), RFC 8446 (TLS 1.3)"
      - name: "url"
        value: "https://datatracker.ietf.org/doc/html/rfc8446"
      - name: "role"
        value: "Mutual TLS authentication"

# Externe Referenties
