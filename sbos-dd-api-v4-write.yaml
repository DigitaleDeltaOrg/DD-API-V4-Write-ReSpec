# ============================================================================
# STANDAARDEN HIËRARCHIE
# ============================================================================
standaardenHierarchie:
  root: "DD API V4 Write Module"
  children:
    - name: "DD API V4 Core"
      description: "Basis specificatie"
      children:
        - name: "Datamodellen"
          description: "Observation, FoI, Parameter"
        - name: "Semantische property bags"
          description: "Flexibele property structuren"
