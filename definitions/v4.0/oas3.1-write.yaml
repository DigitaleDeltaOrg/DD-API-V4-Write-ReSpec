openapi: 3.1.0
info:
  title: DD-API-V4 Write Module
  description: |
    DD API V4 Write Module - Batch processing for adding/updating/retracting data.

    This module adds write functionality to DD API V4. It provides a batch-based
    method for adding, updating, and retracting observations, features of interest, and parameters.
    
    ## Key Features
    
    - **Batch processing per entity**: Separate endpoints per entity type
    - **Asynchronous execution**: Jobs are processed in the background
    - **Custom wrapper**: Replaces OData wrapper with batch-specific structure
    - **OAS 3.1**: Remains conformant to OpenAPI Specification 3.1
    - **Key Exchange**: Server generates authoritative IDs and returns both client and server IDs
    - **Per-entity job tracking**: Job status endpoints under each entity path
    - **Single endpoint for status and results**: GET /write/{entity}/{jobId} returns status and (when completed) the results
    
    ## Key Exchange Mechanism
    
    The server always generates the server ID (as string) and returns it.
    This prevents key conflicts between different providers and allows clients to use any desired ID format for their own identifiers.
    
    ### For INSERT operations (first time adding an entity):
    - Client sends `clientId` (at operation level, can be any format as long as it is represented as a string)
    - `entity.id` MUST be empty string ""
    - **Server can generates its own server ID (string)**
    - Response contains both `clientId` and `id`
    
    ### For UPDATE/RETRACT operations (follow-up operations):
    - Client MUST use the **server ID (string)** in `entity.id`
    - `clientId` MUST be absent
    - Using clientId in update/retract results in error `CLIENTID_NOT_ALLOWED`
    
    ## Job Processing
    When the job is still queued or processing, the response contains only status information.
    When the job is completed (or failed), the response includes detailed operation results and any errors.
    
    The job status can be:
    - `queued`: Job is waiting to be processed
    - `processing`: Job is being processed
    - `completed`: Job has finished (successfully or with errors) - includes operation results
    - `failed`: Job failed before processing could start - includes error details
  
