      summary: Get parameter job status and results
      description: |
        Retrieve the current status of a parameter batch job.
        
        When the job is still queued or processing, the response contains only status information.
        When the job is completed (or failed), the response includes detailed operation results and any errors.
      operationId: write.parameter.getJob
      parameters:
        - name: jobId
          in: path
          required: true
          description: Unique identifier of the parameter job
          schema:
            type: string
            
      responses:
        '200':
          description: Job status and results (if completed)
          content:
